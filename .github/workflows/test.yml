name: Test

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RailReader2.slnx

      - name: Build
        run: dotnet build RailReader2.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RailReader2.slnx -c Release --no-build --verbosity normal

  # The Inno installer is otherwise only compiled by release.yml. This compiles it and runs the silent
  # in-app update the way the app does (wait for the app's PID, upgrade in place, relaunch) on real Windows.
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Silent update test
        shell: pwsh
        run: ./installer/test-silent-update.ps1
