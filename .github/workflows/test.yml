name: Test

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RailReader2.slnx

      - name: Build
        run: dotnet build RailReader2.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RailReader2.slnx -c Release --no-build --verbosity normal

      # The library search index (docs/library-search-design.md) needs FTS5 in the bundled SQLite.
      - name: SQLite FTS5 probe
        run: dotnet run --project src/RailReader2.Cli -c Release --no-build -- library probe

  # The Inno installer is otherwise only compiled by release.yml. This compiles it and runs the silent
  # in-app update the way the app does (wait for the app's PID, upgrade in place, relaunch) on real Windows.
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Silent update test
        shell: pwsh
        run: ./installer/test-silent-update.ps1

  # The app (ReadyToRun, GUI subsystem) loads its native SQLite differently from the AOT CLI above, so the
  # published app, and a silent install of the real installer built from it, each run a headless library
  # round trip (`RailReader2.exe --library-probe`): railreader2#298.
  app-library-probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Publish app (as release.yml does)
        run: dotnet publish src/RailReader2/RailReader2.csproj -c Release -r win-x64 --self-contained -o publish/

      - name: Library probe (published and installed)
        shell: pwsh
        run: ./installer/test-library-probe.ps1
