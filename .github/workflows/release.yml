name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MODEL_URL: "https://huggingface.co/stefanj0/docling-layout-heron-int8-onnx/resolve/main/docling-layout-heron-int8.onnx"
  MODEL_NAME: "docling-layout-heron-int8.onnx"

jobs:
  download-model:
    runs-on: ubuntu-24.04
    steps:
      - name: Download ONNX model
        run: |
          mkdir -p models
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -o "models/$MODEL_NAME" "$MODEL_URL"

      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: onnx-model
          path: models/${{ env.MODEL_NAME }}
          retention-days: 1

  build-linux:
    needs: download-model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install AppImage dependencies
        run: sudo apt-get update && sudo apt-get install -y fuse libfuse2 zsync

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: onnx-model
          path: models/

      - name: Publish
        run: dotnet publish src/RailReader2/RailReader2.csproj -c Release -r linux-x64 --self-contained -o publish/

      # railreader2-mcp (roadmap M8): the small NativeAOT MCP server, beside the app; it uses the app's own
      # libe_sqlite3.so. In the AppImage it is reached as `railreader2-x86_64.AppImage --mcp` (AppRun below).
      - name: Publish railreader2-mcp
        run: |
          dotnet publish src/RailReader2.Mcp/RailReader2.Mcp.csproj -c Release -r linux-x64 -o publish-mcp/
          cp publish-mcp/RailReader2.Mcp publish/
          test -f publish/libe_sqlite3.so

      - name: Download appimagetool
        run: |
          curl -fL --retry 3 --retry-delay 5 -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/models
          cp -r publish/* AppDir/usr/bin/
          cp models/$MODEL_NAME AppDir/models/

          # AppStream reverse-DNS app-id. Everything in the AppDir (.desktop, icon,
          # metainfo) is named after it so appstreamcli's strict checks
          # (cid-desktopapp-is-not-rdns, metainfo-filename-cid-mismatch) pass.
          # Source files in assets/ keep their short names so README and the
          # Windows installer don't have to change.
          APP_ID="io.github.sjvrensburg.RailReader2"

          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/metainfo AppDir/usr/share/mime/packages
          # Rewrite the desktop file's Icon= to match the new icon basename.
          sed "s/^Icon=.*/Icon=${APP_ID}/" assets/railreader2.desktop > "AppDir/usr/share/applications/${APP_ID}.desktop"
          cp assets/railreader2.png "AppDir/usr/share/icons/hicolor/256x256/apps/${APP_ID}.png"
          # One metainfo file only, under the modern .metainfo.xml name. appimagetool
          # only looks for the legacy .appdata.xml name and warns that it is missing;
          # that warning is harmless. Shipping both names makes consumers see the
          # component twice (the AppImage catalog read the licence as "MITMIT").
          cp assets/railreader2.metainfo.xml "AppDir/usr/share/metainfo/${APP_ID}.metainfo.xml"
          # The .railreading type; registered only when a desktop integrator (appimaged, Gear Lever)
          # installs it, since an AppImage can't register MIME types by itself.
          cp assets/railreader2-mime.xml "AppDir/usr/share/mime/packages/${APP_ID}.xml"
          # Top-level copies are what appimagetool embeds into the AppImage runtime.
          cp "AppDir/usr/share/applications/${APP_ID}.desktop" "AppDir/${APP_ID}.desktop"
          cp "AppDir/usr/share/icons/hicolor/256x256/apps/${APP_ID}.png" "AppDir/${APP_ID}.png"

          # AppRun entry point
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          SELF="$(readlink -f "$0")"
          HERE="${SELF%/*}"
          export PATH="${HERE}/usr/bin:${PATH}"
          # `--mcp [args]`: the MCP server for AI tools (railreader2-mcp), over stdin/stdout. The mount
          # point changes every run, so agents are configured with the AppImage's own path plus --mcp.
          if [ "$1" = "--mcp" ]; then
            shift
            exec "${HERE}/usr/bin/RailReader2.Mcp" "$@"
          fi
          exec "${HERE}/usr/bin/RailReader2" "$@"
          EOF
          chmod +x AppDir/AppRun

          # zstd-compressed squashfs: decompresses far faster than the default,
          # so demand-paging the ~138 MB bundled .NET runtime through FUSE on
          # launch is cheaper. Level 19 keeps the file small (zstd decompression
          # speed is ~constant across levels, so this is a build-time cost only).
          #
          # -u embeds update information so AppImageUpdate (and AppImage catalog
          # tooling) can find new releases; with zsyncmake installed, appimagetool
          # also writes the matching .zsync, which must be published next to the
          # AppImage on every release. The file name carries no "linux": all
          # AppImages are for Linux (AppImage catalog naming rule).
          ARCH=x86_64 ./appimagetool --comp zstd \
            --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            -u "gh-releases-zsync|sjvrensburg|railreader2|latest|railreader2-x86_64.AppImage.zsync" \
            AppDir railreader2-x86_64.AppImage
          test -s railreader2-x86_64.AppImage.zsync || { echo "zsync file was not generated"; exit 1; }

      # The MCP server answers through the AppImage (AppRun's --mcp), over real stdio. With no preferences
      # file AI tools are off, so a tool call must come back as the "turned off" tool error.
      - name: Check railreader2-mcp through the AppImage
        run: |
          prefs="$RUNNER_TEMP/no-such-prefs.json"
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_documents","arguments":{}}}' \
            | ./railreader2-x86_64.AppImage --mcp --prefs "$prefs")
          echo "$out"
          echo "$out" | grep -q '"protocolVersion":"2025-06-18"'
          echo "$out" | grep -q 'turned off'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            railreader2-x86_64.AppImage
            railreader2-x86_64.AppImage.zsync
          retention-days: 1

      # FUSE-free alternative: the same self-contained publish as a plain tarball.
      # Extracting and running ./railreader2-linux-x64/RailReader2 avoids squashfs
      # demand-paging entirely — fastest cold start for users who prefer it.
      - name: Package tarball
        run: |
          mkdir -p publish/models
          cp models/$MODEL_NAME publish/models/
          chmod +x publish/RailReader2
          # Tells the app it was installed from the tarball (src/RailReader2.Shared/Updates/UpdateChannel.cs):
          # it can't replace itself, so update checks point at the release page.
          echo tarball > publish/install-kind
          mv publish railreader2-linux-x64
          tar czf railreader2-linux-x64.tar.gz railreader2-linux-x64

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: railreader2-linux-x64.tar.gz
          retention-days: 1

  build-windows:
    needs: download-model
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: onnx-model
          path: models/

      - name: Publish
        run: dotnet publish src/RailReader2/RailReader2.csproj -c Release -r win-x64 --self-contained -o publish/

      # railreader2-mcp (roadmap M8) installs beside the app; the .iss packs everything in publish\.
      - name: Publish railreader2-mcp
        run: |
          dotnet publish src/RailReader2.Mcp/RailReader2.Mcp.csproj -c Release -r win-x64 -o publish-mcp/
          Copy-Item publish-mcp\RailReader2.Mcp.exe -Destination publish\

      - name: Copy model into publish directory
        run: |
          New-Item -ItemType Directory -Force -Path publish\models
          Copy-Item "models\$env:MODEL_NAME" -Destination "publish\models\"

      - name: Convert PNG to ICO
        run: magick assets/railreader2.png -define icon:auto-resize=256,128,64,48,32,16 installer/icon.ico

      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION="$version" installer\railreader2.iss

      # Before the installer ships: install it silently and run the app's headless library round trip
      # from the installed copy (railreader2#298).
      - name: Library probe (published and installed)
        shell: pwsh
        run: ./installer/test-library-probe.ps1 -Setup installer\output\railreader2-setup-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: installer/output/railreader2-setup-x64.exe
          retention-days: 1

  build-msix:
    needs: download-model
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: onnx-model
          path: models/

      # Same script as test.yml's msix job (which installs the result): app + railreader2-mcp + alias.
      - name: Build MSIX package
        shell: powershell
        run: ./msix/build-msix.ps1 -Version "${{ github.ref_name }}" -ModelPath "models\$env:MODEL_NAME" -Output railreader2-win-x64.msix

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: railreader2-win-x64.msix
          retention-days: 1

  build-cli-linux:
    needs: download-model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: onnx-model
          path: models

      - name: Publish CLI
        run: dotnet publish src/RailReader2.Cli/RailReader2.Cli.csproj -c Release -r linux-x64 --self-contained -o publish-cli/

      # The AOT build must still load the bundled SQLite with FTS5 (library search index).
      - name: SQLite FTS5 probe
        run: ./publish-cli/RailReader2.Cli library probe

      - name: Package
        run: |
          mkdir -p publish-cli/models
          cp models/$MODEL_NAME publish-cli/models/
          cd publish-cli
          chmod +x RailReader2.Cli
          tar czf ../railreader2-cli-linux-x64.tar.gz RailReader2.Cli *.so models/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-cli
          path: railreader2-cli-linux-x64.tar.gz
          retention-days: 1

  build-cli-windows:
    needs: download-model
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: onnx-model
          path: models

      - name: Publish CLI
        run: dotnet publish src/RailReader2.Cli/RailReader2.Cli.csproj -c Release -r win-x64 --self-contained -o publish-cli/

      # The AOT build must still load the bundled SQLite with FTS5 (library search index).
      - name: SQLite FTS5 probe
        run: .\publish-cli\RailReader2.Cli.exe library probe

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path publish-cli\models
          Copy-Item "models\$env:MODEL_NAME" -Destination "publish-cli\models\"
          Compress-Archive -Path publish-cli\RailReader2.Cli.exe, publish-cli\*.dll, publish-cli\models -DestinationPath railreader2-cli-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-cli
          path: railreader2-cli-win-x64.zip
          retention-days: 1

  release:
    needs: [build-linux, build-windows, build-cli-linux, build-cli-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: src
          sparse-checkout: |
            scripts
            src/RailReader2.Shared/Updates

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # In-app updates read update-manifest.json from the latest release and verify its signature with
      # the public key built into the app. A release without a valid manifest would break update checks
      # for everyone, so a missing secret or a key mismatch fails the release.
      - name: Write and sign update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::The UPDATE_SIGNING_KEY secret is not set (scripts/generate-update-signing-key.sh)"; exit 1; }
          python3 src/scripts/write-update-manifest.py "${{ github.ref_name }}" . update-manifest.json
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-key.pem" -out update-manifest.json.sig update-manifest.json
          rm -f "$RUNNER_TEMP/update-key.pem"
          openssl dgst -sha256 -verify src/src/RailReader2.Shared/Updates/update-signing-key.pub.pem \
            -signature update-manifest.json.sig update-manifest.json
          cat update-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            railreader2-x86_64.AppImage
            railreader2-x86_64.AppImage.zsync
            railreader2-linux-x64.tar.gz
            railreader2-setup-x64.exe
            railreader2-cli-linux-x64.tar.gz
            railreader2-cli-win-x64.zip
            update-manifest.json
            update-manifest.json.sig
